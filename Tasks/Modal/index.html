<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="click">Click to open Modal</button>
    <div class="overlay">
     <div class="container">
     <div class="modal-header">
       <h3>Modal Title</h3>
       <span class="close">&times;</span>
     </div>
      <p>This is the modal Content. You can place any information</p>
      <buton class="cancel">cancel</buton>
      <button class="save">Save Changes</button>
     </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
